<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wikipedia 日本語版 閲覧数ランキング</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#182638;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body.locked{overflow:hidden}
main{max-width:720px;margin:auto;padding:20px 14px 28px}
h1{font-size:22px;margin:0 0 4px}
h1 span{color:#2456a6}
.lead{font-size:13px;line-height:1.7;color:#526174;margin:0 0 4px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
.controls button,.controls select{font:inherit;min-height:44px;min-width:44px;padding:6px 12px;border:1px solid #b8c7dc;border-radius:8px;background:#fff;color:#182638;cursor:pointer}
.controls button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2456a6;outline-offset:2px}
#date{font-weight:700}
#status{font-size:12px;line-height:1.7;color:#526174;min-height:20px;margin:0 0 10px}
ol{list-style:none;margin:0;padding:0}
li.row{display:flex;gap:10px;align-items:center;padding:12px 10px;background:#fff;border-bottom:1px solid #dce4ef}
li.row:first-child{border-top:1px solid #dce4ef;border-radius:8px 8px 0 0}
li.row:last-child{border-radius:0 0 8px 8px;border-bottom:1px solid #dce4ef}
.rank{font-size:20px;font-weight:700;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.item{flex:1;min-width:0}
.item a{color:#2456a6;font-weight:600;font-size:15px;line-height:1.4;text-decoration:none;overflow-wrap:anywhere}
.meta{font-size:12px;color:#526174;margin-top:4px}
.diff{margin-left:8px;font-weight:600}
.diff.up{color:#0d7a44}.diff.down{color:#b3402a}.diff.new{color:#2456a6}
.track{height:4px;background:#e4ebf6;border-radius:2px;margin-top:6px;overflow:hidden}
.bar{height:100%;background:#2456a6}
.imgbtn{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #b8c7dc;border-radius:8px;background:#fff;color:#2456a6;cursor:pointer}
footer{margin-top:20px;font-size:12px;line-height:1.8;color:#526174}
/* ---- viewer ---- */
#viewer{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #dce4ef;background:#fff}
.vbar button,.vbar a{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#2456a6;text-decoration:none;border:0;background:none;cursor:pointer}
#vTitle{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtabs{display:flex;border-bottom:1px solid #dce4ef}
.vtabs button,.vtabs a{font:inherit;min-height:44px;padding:10px 12px;border:0;background:#fff;color:#526174;border-bottom:3px solid transparent;text-decoration:none;font-weight:600}
.vtabs .on{color:#182638;border-bottom-color:#2456a6}
.vpane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.gbtn{display:block;text-align:center;font:inherit;font-weight:600;min-height:44px;line-height:44px;border:1px solid #b8c7dc;border-radius:8px;background:#f0f4fa;color:#2456a6;text-decoration:none;margin-bottom:12px;overflow-wrap:anywhere;padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
@media (max-width:430px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.cell{margin:0}
.cell a{display:block}
.cell img{width:100%;height:118px;object-fit:cover;border-radius:8px;display:block;background:#e4ebf6}
.cell figcaption{font-size:11px;line-height:1.5;color:#526174;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{color:#526174;font-size:13px;line-height:1.8;margin:0}
.imgcount{font-size:12px;color:#526174;margin:12px 0 0;line-height:1.7}
/* ---- article body ---- */
.article{font-size:15px;line-height:1.8;overflow-wrap:break-word}
.article img{max-width:100%;height:auto}
.article .tblwrap{overflow-x:auto;margin:12px 0}
.article table{float:none!important;width:100%!important;max-width:100%!important;border-collapse:collapse;margin:0}
.article h1,.article h2,.article h3,.article h4{line-height:1.4;margin:20px 0 8px}
.article p{margin:10px 0}
.article ul,.article ol{padding-left:24px;margin:10px 0}
.article figure{margin:12px 0}
.article a{color:#2456a6}
/* 折りたたみ(見出しごとに開閉) */
.article details{border-bottom:1px solid #dce4ef}
.article summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:16px;padding:10px 2px}
.article summary::-webkit-details-marker{display:none}
.article summary::before{content:"";flex:none;width:8px;height:8px;border-right:2px solid #526174;border-bottom:2px solid #526174;transform:rotate(-45deg);transition:transform .15s}
.article details[open]>summary::before{transform:rotate(45deg)}
.article summary h2,.article summary h3,.article summary h4{margin:0;font-size:16px;line-height:1.4}
.article .secbody{padding:2px 2px 10px 12px}
</style>
</head>
<body>
<main id="page">
<h1>いま読まれている <span>Wikipedia</span></h1>
<p class="lead">日本語版の閲覧数ランキングです。検索回数ではありません。</p>
<div class="controls">
<button id="prev" aria-label="前日">‹</button>
<strong id="date"></strong>
<button id="next" aria-label="翌日">›</button>
<select id="count" aria-label="表示件数">
<option value="20" selected>上位20</option>
<option value="50">上位50</option>
<option value="100">上位100</option>
</select>
<button id="refresh">最新を確認</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<ol id="list"></ol>
<noscript>ランキングの表示にはJavaScriptを有効にしてください。</noscript>
<footer>出典：Wikimedia Pageviews API。日付は公式データの集計日（UTC）です。メインページ・特別ページなどを除外して順位を振り直しています。<span id="savedNote"></span>通信できない場合は古いデータのまま表示します。</footer>
</main>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="記事ビューア">
<div class="vbar">
<button id="vClose" aria-label="閉じる">✕</button>
<strong id="vTitle"></strong>
<a id="vExt" target="_blank" rel="noopener" aria-label="Wikipediaで開く">↗</a>
</div>
<div class="vtabs" role="tablist">
<button id="tabBody" role="tab" aria-selected="true">Wikipedia 本文</button>
<button id="tabImg" role="tab" aria-selected="false">画像</button>
<a id="tabGoogle" role="tab" target="_blank" rel="noopener">Google画像検索 ↗</a>
</div>
<div id="vBody" class="vpane article" role="tabpanel"></div>
<div id="vImgs" class="vpane" role="tabpanel" hidden>
<a id="gBtn" class="gbtn" target="_blank" rel="noopener"></a>
<div id="grid" class="grid"></div>
<p id="imgCount" class="imgcount"></p>
</div>
</div>

const $=id=>document.getElementById(id);
const cache=new Map();
cache.set(savedDate,savedLatest.map(p=>({article:p[0],views:p[1]})));
if(savedPrev.length)cache.set(offset(savedDate,-1),savedPrev.map(p=>({article:p[0],views:p[1]})));
let current=savedDate,latest=savedDate,serial=0;
const excluded=/^(メインページ$|特別:|Special:|Wikipedia:|Portal:|Portal_talk:|ポータル:|Help:|ヘルプ:|Category:|カテゴリ:|Template:|テンプレート:|File:|ファイル:|User:|利用者:|ノート:|Talk:)/i;

function offset(day,n){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function displayTitle(t){return t.replace(/_/g,' ')}
function titleUrl(t){return 'https://ja.wikipedia.org/wiki/'+encodeURIComponent(t)}
function googleUrl(t){return 'https://www.google.com/search?tbm=isch&hl=ja&q='+encodeURIComponent(t)}

const IMG_SVG='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 14H5l4.5-6 3 4 2-2.5L19 17ZM8 9.5A1.5 1.5 0 1 1 9.5 8 1.5 1.5 0 0 1 8 9.5Z"/></svg>';

function draw(){
const rows=cache.get(current)||[];
const prev=cache.get(offset(current,-1));
const ranks=prev?new Map(prev.map((a,i)=>[a.article,i+1])):null;
$('date').textContent=current.replace(/-/g,'/')+'付';
$('next').disabled=current>=latest;
const n=Number($('count').value);
const maxV=rows.length?rows[0].views:1;
$('list').innerHTML=rows.slice(0,n).map((a,i)=>{
const old=ranks&&ranks.get(a.article);
const diff=!ranks?'<span class="diff">比較データなし</span>'
:old===undefined?'<span class="diff new">new</span>'
:old===i+1?'<span class="diff">変動なし</span>'
:old>i+1?'<span class="diff up">↑'+(old-i-1)+'</span>'
:'<span class="diff down">↓'+(i+1-old)+'</span>';

'<div class="item"><a class="titlelink" data-t="'+escapeText(a.article)+'" href="'+titleUrl(a.article)+'">'+escapeText(displayTitle(a.article))+'</a>'+

'<div class="track"><div class="bar" style="width:'+(a.views/maxV*100).toFixed(1)+'%"></div></div></div>'+
'<button class="imgbtn" data-t="'+escapeText(a.article)+'" aria-label="'+escapeText(displayTitle(a.article))+' の画像を見る">'+IMG_SVG+'</button></li>';

async function fetchJSON(url){
const controller=new AbortController();
let timer;
try{
const job=fetch(url,{signal:controller.signal}).then(r=>{
if(!r.ok)throw new Error('HTTP '+r.status);
return r.json();
});
const limit=new Promise((_,rej)=>{timer=setTimeout(()=>{controller.abort();rej(new Error('時間切れ'))},6000)});
return await Promise.race([job,limit]);
}finally{clearTimeout(timer)}
}

async function get(day){
if(cache.has(day))return cache.get(day);
const j=await fetchJSON('https://wikimedia.org/api/rest_v1/metrics/pageviews/top/ja.wikipedia/all-access/'+day.replace(/-/g,'/'));
const rows=j.items[0].articles.filter(a=>!excluded.test(a.article)).sort((a,b)=>b.views-a.views);
if(!rows.length)throw new Error('データなし');
cache.set(day,rows);
return rows;
}

async function show(day){
const id=++serial;
$('status').textContent='指定日のデータを確認しています。現在の一覧はそのまま表示します。';
try{
await get(day);
if(id!==serial)return;
current=day;draw();
$('status').textContent='表示中の集計日：'+current+'。前日との比較を確認しています。';
try{await get(offset(day,-1))}catch(e){}
if(id!==serial)return;
draw();
$('status').textContent='表示中の集計日：'+current+'。'+(cache.has(offset(day,-1))?'前日との順位比較を表示しています。':'前日データが取得できないため、順位比較は表示できません。');
}catch(e){
if(id===serial)$('status').textContent=day+'のデータを取得できませんでした。表示中の'+current+'の一覧を残しています。';
}
}

async function refresh(){
const id=++serial;
$('status').textContent='最新データを確認しています。現在の一覧はそのまま表示します。';
const today=new Date().toISOString().slice(0,10);
for(let n=1;n<=7;n++){
const day=offset(today,-n);
try{
await get(day);
if(id!==serial)return;
latest=day;
await show(day);
return;
}catch(e){if(id!==serial)return}
}
if(id===serial)$('status').textContent='直近7日分を取得できませんでした。表示中の'+current+'のデータは最新とは限りません。';
}

/* ---------- viewer ---------- */
const viewer=$('viewer');
let vTitle='',vLoaded={};
const bodyCache=new Map(),imgCache=new Map();

function openViewer(title,tab){
vTitle=title;vLoaded={};
$('vTitle').textContent=displayTitle(title);
$('vExt').href=titleUrl(title);
$('tabGoogle').href=googleUrl(title);
$('gBtn').textContent='Google画像検索で「'+displayTitle(title)+'」を開く ↗';
$('gBtn').href=googleUrl(title);
viewer.hidden=false;
$('page').style.display='none';
document.body.classList.add('locked');
switchTab(tab||'body');
}
function closeViewer(){
viewer.hidden=true;
$('page').style.display='';
document.body.classList.remove('locked');
$('vBody').innerHTML='';
$('grid').innerHTML='';
$('imgCount').textContent='';
}
function switchTab(tab){
vLoaded[tab]=true;
$('tabBody').classList.toggle('on',tab==='body');
$('tabBody').setAttribute('aria-selected',String(tab==='body'));
$('tabImg').classList.toggle('on',tab==='images');
$('tabImg').setAttribute('aria-selected',String(tab==='images'));
$('vBody').hidden=tab!=='body';
$('vImgs').hidden=tab!=='images';
if(tab==='body'&&!bodyCache.has(vTitle))loadBody(vTitle);
if(tab==='images'&&!imgCache.has(vTitle))loadImages(vTitle);
if(tab==='body'&&bodyCache.has(vTitle))renderBody(vTitle);
if(tab==='images'&&imgCache.has(vTitle))renderImages(vTitle);
}
$('vClose').onclick=closeViewer;
$('tabBody').onclick=()=>switchTab('body');
$('tabImg').onclick=()=>switchTab('images');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)closeViewer()});

async function loadBody(title){
$('vBody').innerHTML='<p class="ph">本文を読み込んでいます…</p>';
const controller=new AbortController();
let timer;
try{
const job=fetch('https://ja.wikipedia.org/api/rest_v1/page/html/'+encodeURIComponent(title),{signal:controller.signal}).then(r=>{
if(!r.ok)throw new Error('HTTP '+r.status);
return r.text();
});
const limit=new Promise((_,rej)=>{timer=setTimeout(()=>{controller.abort();rej(new Error('時間切れ'))},6000)});
const html=await Promise.race([job,limit]);
const doc=new DOMParser().parseFromString(html,'text/html');
doc.querySelectorAll('script,style,link,iframe,form,.mw-editsection,.navbox,.vertical-navbox,.noprint').forEach(el=>el.remove());
doc.querySelectorAll('*').forEach(el=>{
[...el.attributes].forEach(attr=>{if(/^on/i.test(attr.name))el.removeAttribute(attr.name)});
});
doc.querySelectorAll('a[href]').forEach(a=>{
const href=a.getAttribute('href')||'';
let t=null;
try{
if(href.indexOf('./')===0)t=decodeURIComponent(href.slice(2).split('#')[0]);
else if(href.indexOf('/wiki/')===0)t=decodeURIComponent(href.split('/wiki/')[1].split('#')[0]);
}catch(e){}
if(t){a.setAttribute('data-t',t);a.setAttribute('href','#')}
else{a.setAttribute('target','_blank');a.setAttribute('rel','noopener')}
});
const holder=document.createElement('div');
[...doc.body.childNodes].forEach(n=>holder.appendChild(document.importNode(n,true)));
holder.querySelectorAll('table').forEach(tb=>{
if(tb.parentElement&&tb.parentElement.classList.contains('tblwrap'))return;
const w=document.createElement('div');w.className='tblwrap';
tb.parentElement.insertBefore(w,tb);w.appendChild(tb);
});
(function collapse(holder){
const nodes=[...holder.childNodes];
const out=document.createDocumentFragment();
let cur=null;
nodes.forEach(n=>{
const isH=n.nodeType===1&&/^H[1-4]$/.test(n.tagName);
if(isH){
if(cur)out.appendChild(cur);
cur=document.createElement('details');
const s=document.createElement('summary');
s.appendChild(n);
const body=document.createElement('div');
body.className='secbody';
cur.appendChild(s);cur.appendChild(body);
}else if(cur){
cur.lastElementChild.appendChild(n);
}else{
out.appendChild(n);
}
});
if(cur)out.appendChild(cur);
holder.innerHTML='';
holder.appendChild(out);
})(holder);
bodyCache.set(title,holder);
renderBody(title);
}catch(e){
if(!bodyCache.has(title))$('vBody').innerHTML='<p class="ph">本文を取得できませんでした。右上の ↗ からWikipediaで開けます。</p>';
}finally{clearTimeout(timer)}
}

function renderBody(title){
const holder=bodyCache.get(title);
const pane=$('vBody');
pane.innerHTML='';
if(holder)[...holder.childNodes].forEach(n=>pane.appendChild(n.cloneNode(true)));
}

async function loadImages(title){
const grid=$('grid'),cnt=$('imgCount');
let urls=[];
try{
const j=await fetchJSON('https://ja.wikipedia.org/api/rest_v1/page/media-list/'+encodeURIComponent(title));
(j.items||[]).forEach(it=>{
if(it.type!=='image'||!it.srcset||!it.srcset.length)return;
let src=it.srcset[it.srcset.length-1].src||'';
if(src.indexOf('//')===0)src='https:'+src;
if(!src)return;
urls.push({src:src,link:src,cap:(it.caption&&it.caption.text)||''});
});
}catch(e){}
if(!urls.length){
try{
const q=encodeURIComponent(title+' filetype:bitmap');
const j=await fetchJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch='+q+'&prop=imageinfo&iiprop=url&iiurlwidth=500&origin=*');
((j.query&&j.query.pages)||[]).forEach(p=>{
const info=(p.imageinfo&&p.imageinfo[0])||null;
if(!info)return;
const src=info.thumburl||info.url;
if(src)urls.push({src:src,link:info.url||src,cap:''});
});
}catch(e){}
}
urls=urls.slice(0,30);
imgCache.set(title,urls);
renderImages(title);
}
function renderImages(title){
const grid=$('grid'),cnt=$('imgCount');
const urls=imgCache.get(title)||[];
grid.innerHTML='';
if(!urls.length){
grid.innerHTML='<p class="ph">画像が見つかりませんでした。上の「Google画像検索 ↗」から探せます。</p>';
cnt.textContent='0枚 — タップで拡大。出典: Wikipedia / Wikimedia Commons';
return;
}
urls.forEach(u=>{
const fig=document.createElement('figure');
fig.className='cell';
const a=document.createElement('a');
a.href=u.link;a.target='_blank';a.rel='noopener';
const img=document.createElement('img');
img.src=u.src;img.alt='';img.loading='lazy';
img.addEventListener('error',()=>{fig.remove();updateCount()});
a.appendChild(img);
fig.appendChild(a);
if(u.cap){const c=document.createElement('figcaption');c.textContent=u.cap;fig.appendChild(c)}
grid.appendChild(fig);
});
updateCount();
}
function updateCount(){
const n=$('grid').querySelectorAll('.cell').length;
$('imgCount').textContent=n+'枚 — タップで拡大。出典: Wikipedia / Wikimedia Commons';
}

/* ---------- events ---------- */
$('list').addEventListener('click',e=>{
const btn=e.target.closest('.imgbtn');
if(btn){e.preventDefault();e.stopPropagation();openViewer(btn.getAttribute('data-t'),'images');return}
const link=e.target.closest('.titlelink');
if(link){e.preventDefault();openViewer(link.getAttribute('data-t'),'body')}
});
$('vBody').addEventListener('click',e=>{
const a=e.target.closest('a[data-t]');
if(a){e.preventDefault();openViewer(a.getAttribute('data-t'),'body')}
});
$('prev').onclick=()=>show(offset(current,-1));
$('next').onclick=()=>show(offset(current,1));
$('count').onchange=draw;
$('refresh').onclick=refresh;

$('savedNote').textContent='保存済みデータは'+(+savedDate.slice(5,7))+'月'+(+savedDate.slice(8,10))+'日分です。';
draw();
$('status').textContent='保存済みデータ（'+current+'）を表示しています。';
refresh();
</script>
</body>
